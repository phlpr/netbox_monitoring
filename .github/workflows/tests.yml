name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python and release tooling
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .
          python -m unittest tests.test_release_notes
      - name: Check JavaScript syntax
        run: |
          node --check netbox_monitoring/static/netbox_monitoring/js/monitoring_form.js
          node --check tests/browser/monitoring.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox: "4.6.10"
            python: "3.12"
          - netbox: "4.7.0"
            python: "3.14"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NETBOX_ROOT: ${{ github.workspace }}/netbox-source
      NETBOX_CONFIGURATION: tests.configuration
      MONITORING_TEST_DATABASE: test_netbox_monitoring_ci
    steps:
      - uses: actions/checkout@v6
      - name: Check out NetBox
        uses: actions/checkout@v6
        with:
          repository: netbox-community/netbox
          ref: v${{ matrix.netbox }}
          path: netbox-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: netbox-source/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Install NetBox dependencies and built wheel
        run: |
          python -m pip install -r "$NETBOX_ROOT/requirements.txt"
          python -m pip install --no-deps dist/*.whl
      - name: Isolate tests from the source package
        run: |
          mkdir -p "$RUNNER_TEMP/monitoring-tests"
          cp -R tests scripts "$RUNNER_TEMP/monitoring-tests/"
          echo "PYTHONPATH=$RUNNER_TEMP/monitoring-tests:$NETBOX_ROOT/netbox" >> "$GITHUB_ENV"
      - name: Run integration, schema, and migration tests against the wheel
        working-directory: ${{ runner.temp }}/monitoring-tests
        run: python "$NETBOX_ROOT/netbox/manage.py" test tests --keepdb --noinput -v 2
      - name: Check migration state and installed package
        working-directory: ${{ runner.temp }}/monitoring-tests
        run: |
          python "$NETBOX_ROOT/netbox/manage.py" makemigrations netbox_monitoring --check --dry-run
          python "$NETBOX_ROOT/netbox/manage.py" check
          python "$NETBOX_ROOT/netbox/manage.py" setup_monitoring_fields --apply
          python "$NETBOX_ROOT/netbox/manage.py" collectstatic --no-input
          python "$NETBOX_ROOT/netbox/manage.py" shell -c 'from tests.wheel_smoke import verify_install; verify_install()'
